name: checks
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: pip install Pillow==13.0.0
      - run: python -m unittest discover -s tests -v
      - run: python scripts/local_site.py
      - run: npm install --no-save --prefix "$RUNNER_TEMP/web-check" playwright@1.62.1
      - run: "$RUNNER_TEMP/web-check/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser regressions
        run: |
          export NODE_PATH="$RUNNER_TEMP/web-check/node_modules"
          export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          node tests/site.cjs
