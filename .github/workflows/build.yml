name: build
on:
  schedule: [{cron: "17 */6 * * *"}]   # poll upstream for new releases
  workflow_dispatch:
  push: {branches: [main], paths: [nano.py, brand.py, ext.py, release.py, fingerprint.txt, .github/workflows/build.yml]}
concurrency: {group: build, cancel-in-progress: true}
permissions: {contents: write, packages: read, issues: write, pages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, max-parallel: 1, matrix: {target: [android, browser]}}
    env: {GH_TOKEN: "${{ github.token }}", GITHUB_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: gh api -X POST repos/$GITHUB_REPOSITORY/pages -f source[branch]=gh-pages -f source[path]=/ 2>/dev/null || true   # make sure Pages is on
      - run: pip install -q pillow
      - id: v
        run: |
          tag=$(python3 nano.py latest ${{ matrix.target }})
          ph=$(cat nano.py brand.py ext.py release.py fingerprint.txt | sha1sum | cut -c1-7)   # patch changes trigger a rebuild too
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "rel=$tag" >> $GITHUB_OUTPUT
          echo "ph=$ph" >> $GITHUB_OUTPUT
          gh release view "$tag" --json body --jq .body 2>/dev/null | grep -q "patches $ph" && echo "skip=1" >> $GITHUB_OUTPUT || true
      - if: ${{ !steps.v.outputs.skip && matrix.target == 'android' }}
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - if: ${{ !steps.v.outputs.skip && matrix.target == 'browser' }}
        uses: actions/setup-node@v4
        with: {node-version: 24}
      - if: ${{ !steps.v.outputs.skip && matrix.target == 'android' }}
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ks.jks"
          echo "KEYSTORE=$RUNNER_TEMP/ks.jks" >> $GITHUB_ENV
          echo "KS_PASS=${{ secrets.KS_PASS }}" >> $GITHUB_ENV
      - if: ${{ !steps.v.outputs.skip }}
        run: python3 nano.py build ${{ matrix.target }} ${{ steps.v.outputs.tag }}
      - if: ${{ !steps.v.outputs.skip && matrix.target == 'browser' }}
        run: |
          echo "${{ secrets.CRX_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/crx.pem"
          CRX_KEY="$RUNNER_TEMP/crx.pem" REL="${{ steps.v.outputs.rel }}" AMO_KEY="${{ secrets.AMO_KEY }}" AMO_SECRET="${{ secrets.AMO_SECRET }}" python3 ext.py "${{ steps.v.outputs.tag }}"
      - if: ${{ !steps.v.outputs.skip }}
        run: |
          python3 release.py ${{ matrix.target }} "${{ steps.v.outputs.rel }}" "${{ steps.v.outputs.ph }}" > notes.md
          (cd out && sha256sum * > SHA256SUMS)
          gh release delete "${{ steps.v.outputs.rel }}" --cleanup-tag -y 2>/dev/null || true
          title="Bitwarden Patched $([ ${{ matrix.target }} = android ] && echo Android || echo Browser) ${{ steps.v.outputs.tag }}"
          gh release create "${{ steps.v.outputs.rel }}" out/* --title "$title" --notes-file notes.md
      - if: ${{ !steps.v.outputs.skip }}
        run: |   # remember this build in state.json (the site is generated from it)
          python3 state.py record ${{ matrix.target }} "${{ steps.v.outputs.rel }}" "${{ steps.v.outputs.ph }}"
          git config user.name bitwarden-patched; git config user.email actions@users.noreply.github.com
          git add state.json; git commit -qm "state: ${{ matrix.target }} ${{ steps.v.outputs.tag }} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - if: ${{ !steps.v.outputs.skip && matrix.target == 'android' }}
        run: pip install -q fdroidserver
      - if: ${{ !steps.v.outputs.skip }}
        run: python3 sitegen.py
      - if: ${{ failure() && !steps.v.outputs.skip }}
        run: |
          gh issue create --title "Build failed: ${{ matrix.target }} ${{ steps.v.outputs.tag }}" --body "See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
